
<!DOCTYPE html>
<html>
<head>
    <title>Track Issues</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h2>🚧 RoadWatch</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="report.html">Report</a>
        <a href="track.html">Track</a>
        <a href="about.html">About</a>
    </nav>
</header>

<main class="dashboard">
    <h1>Issue Dashboard</h1>
    <p>Track reported infrastructure problems.</p>

    <section class="stats">
        <div><h2 id="total">0</h2><p>Total</p></div>
        <div><h2 id="pending">0</h2><p>Pending</p></div>
        <div><h2 id="progress">0</h2><p>Progress</p></div>
        <div><h2 id="resolved">0</h2><p>Resolved</p></div>
    </section>

    <div class="table">
        <h2>Recent Reports</h2>
        <div id="reports">Loading reports...</div>
    </div>
</main>

<footer>© 2026 RoadWatch</footer>

<script>
const API_URL =
"https://roadwatch-backend-rashmika.onrender.com/api/reports";

async function loadReports() {
    try {
        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Failed to load reports");
        }

        const reports = await response.json();

        let pending = 0;
        let progress = 0;
        let resolved = 0;

        reports.forEach(report => {
            const status = String(report.status || "Pending")
                .toLowerCase();

            if (status === "pending") {
                pending++;
            } else if (
                status.includes("progress") ||
                status.includes("progress")
            ) {
                progress++;
            } else if (status === "resolved") {
                resolved++;
            }
        });

        document.getElementById("total").textContent =
            reports.length;

        document.getElementById("pending").textContent =
            pending;

        document.getElementById("progress").textContent =
            progress;

        document.getElementById("resolved").textContent =
            resolved;

        const reportBox = document.getElementById("reports");
        reportBox.innerHTML = "";

        if (reports.length === 0) {
            reportBox.textContent = "No reports found.";
            return;
        }

        reports.forEach(report => {
            const item = document.createElement("p");

            const type = report.issueType ||
                         report.type ||
                         "Issue";

            const location = report.location || "Unknown";

            const status = report.status || "Pending";

            item.textContent =
                "🚧 " + type + " — " +
                location + " — " + status;

            reportBox.appendChild(item);
        });

    } catch (error) {
        console.error(error);

        document.getElementById("reports").textContent =
            "Unable to load reports.";
    }
}

loadReports();
</script>

</body>
</html>
